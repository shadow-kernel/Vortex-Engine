name: Windows CMake (Jolt) — experiment

# #182: can the native engine build on Windows through the CMake preset (DX12 + Jolt fetched by CMake) instead of
# MSBuild with the physics stub? Runs on pushes to ci/** only; it reports, nothing depends on it yet.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  windows-cmake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submodules (Streamline headers)
        run: git submodule update --init --depth 1 ThirdParty/Streamline
      - name: Setup Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
      # Ninja + the MSVC environment from msvc-dev-cmd: the "Visual Studio 17 2022" generator of the windows-x64 preset
      # finds no VS on today's windows-latest image (it ships a newer Visual Studio).
      - name: Configure (Ninja, Release, DX12 + Jolt)
        run: cmake -S . -B build/windows-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build VortexAPI (Release)
        run: cmake --build build/windows-ninja --target VortexAPI
      - name: What came out
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/windows-ninja -Include *.dll,*.lib,*.exe | Select-Object FullName, Length | Format-Table -AutoSize
          $dll = Get-ChildItem -Recurse build/windows-ninja -Filter VortexAPI.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "no VortexAPI.dll"; exit 1 }
          Write-Host "VortexAPI.dll: $($dll.FullName) ($([math]::Round($dll.Length/1MB,1)) MB)"
      - name: Jolt linked? (exports)
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build/windows-ninja -Filter VortexAPI.dll | Select-Object -First 1
          $out = & dumpbin /exports $dll.FullName 2>$null
          $hits = ($out | Select-String "PhysicsInit|PhysicsStep|PhysicsCharacterCreate").Count
          Write-Host "physics exports found: $hits"
