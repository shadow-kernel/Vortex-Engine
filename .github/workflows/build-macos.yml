name: Build (macOS)

# The macOS app (#184): on main, on tags and on demand — the native engine (CMake, SDL GPU / Metal) with its tests, the
# managed tests, then "Vortex Editor.app" + DMG through tools/macos/make-app.sh, uploaded as an artifact. Pull requests
# are covered by pr-tests.yml. Signing / notarisation is #96; templates ship as they are checked out (#299).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos-app:
    runs-on: macos-latest   # Apple Silicon runner, Xcode preinstalled
    timeout-minutes: 60
    permissions:
      contents: write       # tags: attach the DMG to the release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Default 3D template (the smoke project; no LFS)
        run: git submodule update --init --depth 1 Templates/Default3D

      - name: Install toolchain
        run: brew install ninja assimp sdl3

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure + build the native engine (Release)
        run: |
          cmake --preset macos-release
          cmake --build --preset macos-release

      - name: Native tests (audio, physics, particles, navigation, geometry)
        run: ctest --preset macos-release --output-on-failure

      - name: Managed tests (Vortex.Core)
        run: dotnet run --project Managed/Vortex.Core.Tests -c Release

      - name: Build "Vortex Editor.app" + DMG
        run: tools/macos/make-app.sh --skip-native --dmg

      # The runners have a window server and Metal (verified 2026-10-05, run 37338063100), so the checks gate the build.
      - name: Editor smoke (the Claude checks — MCP server + tools, panel, safety, shaders)
        run: |
          export VORTEX_APPDATA_DIR="$RUNNER_TEMP/appdata" VORTEX_SMOKE_FULL=1 VORTEX_SMOKE_ONLY="mcp,claude,title bar,update window"
          cp -R Templates/Default3D "$RUNNER_TEMP/smoke-project"
          perl -e 'alarm shift; exec @ARGV' 300 "dist/macos/Vortex Editor.app/Contents/MacOS/Vortex.Editor" \
            --project="$RUNNER_TEMP/smoke-project" --smoke=25 --capture="$RUNNER_TEMP/capture" | tee "$RUNNER_TEMP/smoke.log"
          if grep -q "SMOKE FAIL" "$RUNNER_TEMP/smoke.log"; then exit 1; fi
          # the run got as far as the MCP checks (a crash before them prints no FAIL line)
          grep -q "SMOKE OK   mcp tools" "$RUNNER_TEMP/smoke.log"
          grep -q "SMOKE OK   title bar" "$RUNNER_TEMP/smoke.log"

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: vortex-editor-macos-arm64
          path: dist/macos/*.dmg
          if-no-files-found: error

      # build-release.yml creates the release with the Windows installer; wait for it, then add the DMG.
      - name: Attach the DMG to the GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$GITHUB_REF_NAME" dist/macos/*.dmg --clobber

      - name: Upload the smoke capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-capture
          path: ${{ runner.temp }}/capture
          if-no-files-found: ignore
