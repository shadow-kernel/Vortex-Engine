name: Runtime pack (Windows)

# Builds the Windows runtime pack that the editor's Build dialog needs to export games for Windows from another
# platform (macOS/Linux): the native DirectX 12 engine (VortexAPI.dll), the self-contained standalone player and
# the HLSL shaders. Download the artifact and install it with Build ▸ "Install runtime pack…".
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows-runtime-pack:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules — Streamline headers)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The native engine comes from CMake (Ninja + MSVC, Jolt linked); vcvars64 is scoped to this step (#311).
      - name: Build the runtime pack
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          powershell -ExecutionPolicy Bypass -File tools\windows\make-runtime-pack.ps1 -Configuration Release -Zip || exit /b 1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vortex-runtime-win-x64
          path: dist/runtimes/vortex-runtime-win-x64.zip
          if-no-files-found: error
